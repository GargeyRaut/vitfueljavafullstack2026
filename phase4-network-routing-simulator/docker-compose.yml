services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/netsim
      SPRING_DATASOURCE_USERNAME: netsim
      SPRING_DATASOURCE_PASSWORD: netsim
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: netsim
      POSTGRES_USER: netsim
      POSTGRES_PASSWORD: netsim
    ports:
      - "5432:5432"
    volumes:
      - netsim-db-data:/var/lib/postgresql/data

volumes:
  netsim-db-data:
